services:
  postgres:
    image: postgres:16-alpine
    container_name: jpx-alpha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jpx_alpha
      POSTGRES_USER: jpx
      POSTGRES_PASSWORD: jpxpass
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

volumes:
  postgres_data:
